<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lettore Pulito</title>
    <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
    <style>
        :root { --bg: #fdf6e3; --text: #2c3e50; --accent: #d33682; }
        body { font-family: 'Georgia', serif; margin: 0; background: var(--bg); color: var(--text); }
        
        /* Libreria */
        #library-view { padding: 20px; text-align: center; }
        #library { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 20px; }
        .book-item { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; border: 1px solid #eee; transition: 0.2s; }
        .book-item:active { transform: scale(0.98); }
        
        /* Lettore */
        #reader-view { display: none; padding: 20px; padding-bottom: 200px; }
        #content-area { max-width: 700px; margin: 0 auto; line-height: 1.8; font-size: 1.15em; }
        #content-area p { cursor: pointer; padding: 12px; border-radius: 8px; margin: 8px 0; transition: background 0.2s; }
        #content-area p.reading { background: #fff9c4; border-left: 5px solid var(--accent); box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        
        /* Controlli */
        #controls { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); z-index: 1000; border-radius: 20px 20px 0 0; }
        .btns { display: flex; justify-content: space-around; gap: 15px; margin-bottom: 15px; }
        button { flex: 1; padding: 15px; border-radius: 30px; border: none; background: var(--accent); color: white; font-weight: bold; font-size: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn-sec { background: #586e75; }
        select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; background: #f9f9f9; font-size: 14px; }
        .back-link { display: inline-block; margin-bottom: 25px; color: var(--accent); text-decoration: none; font-weight: bold; font-size: 1.1em; }
    </style>
</head>
<body>

    <div id="library-view">
        <h1>📚 La mia Libreria</h1>
        <div id="library"></div>
        <button style="position:fixed; bottom:30px; right:30px; width:65px; height:65px; border-radius:50%; font-size:35px;" onclick="document.getElementById('fileInput').click()">+</button>
        <input type="file" id="fileInput" style="display:none" accept=".html,.htm,.txt" onchange="importFile(event)">
    </div>

    <div id="reader-view">
        <a href="#" class="back-link" onclick="location.reload()">← Esci dal libro</a>
        <div id="content-area"></div>
        
        <div id="controls">
            <div id="status" style="font-size: 0.85em; text-align: center; margin-bottom: 10px; color: #888; font-style: italic;">Tocca un paragrafo per iniziare</div>
            <div class="btns">
                <button class="btn-sec" onclick="saveBookmark()">📌 Segna</button>
                <button id="pauseBtn" onclick="stopSpeech()">Pausa</button>
            </div>
            <select id="voiceSelect"></select>
        </div>
    </div>

    <script>
        const synth = window.speechSynthesis;
        let currentBookId = null;
        let lastReadPara = null;

        function populateVoices() {
            const voices = synth.getVoices();
            const select = document.getElementById('voiceSelect');
            const filtered = voices.filter(v => v.lang.includes('it') || v.lang.includes('en'));
            select.innerHTML = filtered.map(v => `<option value="${v.name}">${v.name} (${v.lang})</option>`).join('');
        }
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoices;
        }
        populateVoices();

        async function importFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const text = await file.text();
            const id = "h_" + Date.now();
            await localforage.setItem(id, { id, title: file.name.replace('.html',''), content: text, savedIndex: 0 });
            renderLibrary();
        }

        async function renderLibrary() {
            const lib = document.getElementById('library');
            lib.innerHTML = "";
            const keys = await localforage.keys();
            for (let k of keys) {
                if (k.startsWith("h_")) {
                    const b = await localforage.getItem(k);
                    const div = document.createElement('div');
                    div.className = 'book-item';
                    div.innerHTML = `📖<br><small>${b.title}</small>`;
                    div.onclick = () => openBook(b.id);
                    lib.appendChild(div);
                }
            }
        }

        // --- IL "FILTRO MAGICO" PER PULIRE IL CODICE ---
        async function openBook(id) {
            const b = await localforage.getItem(id);
            currentBookId = id;
            document.getElementById('library-view').style.display = 'none';
            document.getElementById('reader-view').style.display = 'block';
            
            const area = document.getElementById('content-area');
            
            // 1. Usiamo un parser vero per estrarre solo il testo
            const parser = new DOMParser();
            const doc = parser.parseFromString(b.content, 'text/html');
            
            // 2. Rimuoviamo script e stili che sporcano il testo
            const cleanUp = doc.querySelectorAll('script, style, meta, link');
            cleanUp.forEach(el => el.remove());

            // 3. Prendiamo solo il testo pulito e lo dividiamo in paragrafi reali
            // Usiamo il testo del body, diviso per i blocchi di testo che hanno senso
            const textContent = doc.body.innerText
                .split('\n')
                .map(p => p.trim())
                .filter(p => p.length > 5); // Scartiamo frammenti troppo corti o vuoti
            
            area.innerHTML = textContent.map((p, index) => 
                `<p id="p-${index}" onclick="readParagraph(${index})">${p}</p>`
            ).join('');

            if (b.savedIndex) {
                const el = document.getElementById(`p-${b.savedIndex}`);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    el.classList.add('reading');
                    lastReadPara = el;
                    lastReadPara.index = b.savedIndex;
                }
            }
        }

        function readParagraph(index) {
            stopSpeech();
            const el = document.getElementById(`p-${index}`);
            if (!el) return;

            if (lastReadPara) lastReadPara.classList.remove('reading');
            el.classList.add('reading');
            lastReadPara = el;
            lastReadPara.index = index;

            const utter = new SpeechSynthesisUtterance(el.innerText);
            const selectedVoiceName = document.getElementById('voiceSelect').value;
            utter.voice = synth.getVoices().find(v => v.name === selectedVoiceName);
            
            utter.onend = () => {
                // Passa al prossimo paragrafo automaticamente
                const next = index + 1;
                if (document.getElementById(`p-${next}`)) {
                    readParagraph(next);
                    // Scroll automatico per seguire la lettura
                    document.getElementById(`p-${next}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            };

            synth.speak(utter);
            document.getElementById('status').innerText = "📖 Sto leggendo...";
        }

        function stopSpeech() {
            synth.cancel();
            document.getElementById('status').innerText = "⏸ In pausa";
        }

        async function saveBookmark() {
            if (lastReadPara && currentBookId) {
                const b = await localforage.getItem(currentBookId);
                b.savedIndex = lastReadPara.index;
                await localforage.setItem(currentBookId, b);
                document.getElementById('status').innerText = "📌 Posizione salvata!";
                setTimeout(() => { document.getElementById('status').innerText = "In pausa"; }, 2000);
            }
        }

        renderLibrary();
    </script>
</body>
</html>
