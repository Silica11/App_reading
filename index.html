<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lettore Driving Mode</title>
    <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
    <style>
        :root { --bg: #121212; --text: #e0e0e0; --accent: #ff4757; --btn-play: #2ed573; --btn-sec: #1e90ff; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
        
        /* Libreria */
        #library-view { padding: 20px; text-align: center; }
        #library { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; margin-top: 20px; }
        .book-item { background: #1e1e1e; padding: 20px; border-radius: 15px; position: relative; cursor: pointer; border: 1px solid #333; }
        .delete-btn { position: absolute; top: -5px; right: -5px; background: var(--accent); color: white; border: none; border-radius: 50%; width: 30px; height: 30px; font-weight: bold; cursor: pointer; }
        
        /* Lettore */
        #reader-view { display: none; padding: 20px; padding-bottom: 300px; }
        #content-area { max-width: 600px; margin: 0 auto; line-height: 1.6; font-size: 1.2em; }
        #content-area p { padding: 15px; border-radius: 10px; margin: 10px 0; background: #1e1e1e; }
        #content-area p.reading { background: #333; border-left: 8px solid var(--btn-play); color: #fff; }
        
        /* CONTROLLI GIGANTI (DRIVING MODE) */
        #controls { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a1a; padding: 20px; box-shadow: 0 -10px 30px rgba(0,0,0,0.5); z-index: 1000; border-radius: 30px 30px 0 0; }
        .driving-btns { display: flex; flex-direction: column; gap: 15px; }
        .main-btns { display: flex; gap: 15px; height: 120px; } /* Altezza maggiorata per l'auto */
        
        .big-btn { flex: 1; border-radius: 20px; border: none; color: white; font-weight: 800; font-size: 24px; cursor: pointer; text-transform: uppercase; box-shadow: 0 6px 0 rgba(0,0,0,0.2); }
        .big-btn:active { transform: translateY(4px); box-shadow: none; }
        
        #pauseBtn { background: var(--btn-play); }
        #markBtn { background: var(--btn-sec); }
        
        select { width: 100%; padding: 15px; border-radius: 12px; background: #222; color: white; border: 1px solid #444; margin-bottom: 15px; font-size: 16px; }
        .back-link { display: block; margin-bottom: 30px; color: #aaa; text-decoration: none; font-weight: bold; font-size: 1.2em; text-align: center; }
    </style>
</head>
<body>

    <div id="library-view">
        <h1>🚗 Audio Libreria</h1>
        <div id="library"></div>
        <button style="position:fixed; bottom:30px; right:30px; width:70px; height:70px; border-radius:50%; font-size:40px; background:var(--btn-play); border:none; color:white;" onclick="document.getElementById('fileInput').click()">+</button>
        <input type="file" id="fileInput" style="display:none" accept=".html,.htm,.txt" onchange="importFile(event)">
    </div>

    <div id="reader-view">
        <a href="#" class="back-link" onclick="location.reload()">⬅ ESCI DAL LIBRO</a>
        <div id="content-area"></div>
        
        <div id="controls">
            <select id="voiceSelect"></select>
            <div class="driving-btns">
                <div class="main-btns">
                    <button id="markBtn" class="big-btn" onclick="saveBookmark()">📌 SEGNA</button>
                    <button id="pauseBtn" class="big-btn" onclick="togglePlay()">PAUSA</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const synth = window.speechSynthesis;
        let currentBookId = null;
        let lastReadPara = null;
        let isPaused = false;

        function populateVoices() {
            const voices = synth.getVoices();
            const select = document.getElementById('voiceSelect');
            const filtered = voices.filter(v => v.lang.includes('it') || v.lang.includes('en'));
            select.innerHTML = filtered.map(v => `<option value="${v.name}">${v.name} (${v.lang})</option>`).join('');
        }
        speechSynthesis.onvoiceschanged = populateVoices;
        populateVoices();

        async function importFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const text = await file.text();
            const id = "h_" + Date.now();
            await localforage.setItem(id, { id, title: file.name.replace('.html',''), content: text, savedIndex: 0 });
            renderLibrary();
        }

        async function renderLibrary() {
            const lib = document.getElementById('library');
            lib.innerHTML = "";
            const keys = await localforage.keys();
            for (let k of keys) {
                if (k.startsWith("h_")) {
                    const b = await localforage.getItem(k);
                    const div = document.createElement('div');
                    div.className = 'book-item';
                    div.innerHTML = `
                        <button class="delete-btn" onclick="event.stopPropagation(); deleteBook('${b.id}')">X</button>
                        📖<br><small>${b.title}</small>
                    `;
                    div.onclick = () => openBook(b.id);
                    lib.appendChild(div);
                }
            }
        }

        async function deleteBook(id) {
            if(confirm("Vuoi eliminare questo libro?")) {
                await localforage.removeItem(id);
                renderLibrary();
            }
        }

        async function openBook(id) {
            const b = await localforage.getItem(id);
            currentBookId = id;
            document.getElementById('library-view').style.display = 'none';
            document.getElementById('reader-view').style.display = 'block';
            
            const area = document.getElementById('content-area');
            const parser = new DOMParser();
            const doc = parser.parseFromString(b.content, 'text/html');
            const textContent = doc.body.innerText.split('\n').map(p => p.trim()).filter(p => p.length > 5);
            
            area.innerHTML = textContent.map((p, index) => `<p id="p-${index}" onclick="readParagraph(${index})">${p}</p>`).join('');

            if (b.savedIndex) {
                const el = document.getElementById(`p-${b.savedIndex}`);
                if (el) {
                    el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    readParagraph(b.savedIndex); // Inizia subito dal segnalibro
                }
            }
        }

        function readParagraph(index) {
            synth.cancel();
            const el = document.getElementById(`p-${index}`);
            if (!el) return;

            if (lastReadPara) lastReadPara.classList.remove('reading');
            el.classList.add('reading');
            lastReadPara = el;
            lastReadPara.index = index;

            const utter = new SpeechSynthesisUtterance(el.innerText);
            const selectedVoiceName = document.getElementById('voiceSelect').value;
            utter.voice = synth.getVoices().find(v => v.name === selectedVoiceName);
            
            utter.onend = () => {
                if(!isPaused) readParagraph(index + 1);
                document.getElementById(`p-${index+1}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
            };

            synth.speak(utter);
            isPaused = false;
            document.getElementById('pauseBtn').innerText = "PAUSA";
            document.getElementById('pauseBtn').style.background = "#ff4757";
        }

        function togglePlay() {
            if (synth.speaking && !isPaused) {
                synth.cancel();
                isPaused = true;
                document.getElementById('pauseBtn').innerText = "RIPRENDI";
                document.getElementById('pauseBtn').style.background = "#2ed573";
            } else if (lastReadPara) {
                readParagraph(lastReadPara.index);
            }
        }

        async function saveBookmark() {
            if (lastReadPara && currentBookId) {
                const b = await localforage.getItem(currentBookId);
                b.savedIndex = lastReadPara.index;
                await localforage.setItem(currentBookId, b);
                const btn = document.getElementById('markBtn');
                btn.innerText = "SALVATO!";
                setTimeout(() => btn.innerText = "📌 SEGNA", 2000);
            }
        }

        renderLibrary();
    </script>
</body>
</html>
