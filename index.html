<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mio Lettore eBook</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/epub.js/0.3.88/epub.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f8f9fa; color: var(--primary); }
        
        /* Griglia Libreria */
        #library { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px; padding: 20px; padding-bottom: 120px; }
        .book-card { background: white; border-radius: 10px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: pointer; transition: 0.2s; }
        .book-card:active { transform: scale(0.95); }
        .book-card img { width: 100%; height: 200px; object-fit: cover; background: #eee; }
        .book-card p { padding: 8px; font-size: 0.9em; font-weight: bold; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Player Fisso in basso */
        #player { position: fixed; bottom: 0; width: 100%; background: white; box-shadow: 0 -4px 15px rgba(0,0,0,0.1); padding: 15px; display: none; box-sizing: border-box; z-index: 100; }
        .controls { display: flex; justify-content: space-around; align-items: center; margin-bottom: 10px; }
        button { border: none; background: var(--accent); color: white; padding: 12px 20px; border-radius: 25px; font-weight: bold; }
        button:disabled { background: #ccc; }
        
        select { width: 100%; padding: 8px; border-radius: 5px; margin-top: 10px; }
        .add-btn { background: #2ecc71; position: fixed; bottom: 20px; right: 20px; width: 60px; height: 60px; border-radius: 50%; font-size: 30px; z-index: 110; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <div id="library">
        </div>

    <button class="add-btn" onclick="document.getElementById('fileInput').click()">+</button>
    <input type="file" id="fileInput" style="display:none" accept=".epub" onchange="handleFileUpload(event)">

    <div id="player">
        <div id="now-playing" style="font-size: 0.8em; margin-bottom: 10px; text-align: center; color: #666;"></div>
        <div class="controls">
            <button onclick="saveBookmark()">📌 Segna</button>
            <button id="playBtn" onclick="togglePlay()" style="background: #e67e22; width: 100px;">Play</button>
            <button onclick="stopReading()" style="background: #e74c3c;">Stop</button>
        </div>
        <select id="voiceSelect"><option>Caricamento voci...</option></select>
    </div>

   <script>
        let currentBook = null;
        let rendition = null;
        let speech = window.speechSynthesis;
        let utterance = new SpeechSynthesisUtterance();
        let isReading = false;

        // Inizializza voci
        function loadVoices() {
            const voices = speech.getVoices();
            const select = document.getElementById('voiceSelect');
            const itEnVoices = voices.filter(v => v.lang.includes('it') || v.lang.includes('en'));
            
            if(itEnVoices.length > 0) {
                select.innerHTML = itEnVoices
                    .map(v => `<option value="${v.name}">${v.name} (${v.lang})</option>`).join('');
            }
        }
        speech.onvoiceschanged = loadVoices;
        loadVoices();

        // GESTIONE CARICAMENTO LIBRO (Versione Migliorata)
        async function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('library').insertAdjacentHTML('afterbegin', '<div id="loading">Caricamento in corso...</div>');

            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const arrayBuffer = e.target.result;
                    const book = ePub(arrayBuffer);
                    
                    // Aspettiamo i metadati con un timeout per sicurezza
                    const metadata = await book.loaded.metadata;
                    let coverUrl = "";
                    
                    try {
                        coverUrl = await book.coverUrl();
                    } catch (err) {
                        console.log("Copertina non trovata");
                        coverUrl = "https://via.placeholder.com/150?text=Nessuna+Copertina";
                    }

                    const bookData = {
                        id: "book_" + Date.now(),
                        title: metadata.title || file.name,
                        cover: coverUrl,
                        content: arrayBuffer,
                        cfi: ''
                    };

                    await localforage.setItem(bookData.id, bookData);
                    console.log("Libro salvato con successo!");
                    renderLibrary();
                } catch (error) {
                    console.error("Errore nel caricamento:", error);
                    alert("Errore nel leggere questo ePub. Assicurati che non sia protetto da DRM.");
                } finally {
                    const loader = document.getElementById('loading');
                    if(loader) loader.remove();
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // MOSTRA I LIBRI
        async function renderLibrary() {
            const lib = document.getElementById('library');
            lib.innerHTML = '';
            
            try {
                const keys = await localforage.keys();
                const bookKeys = keys.filter(k => k.startsWith('book_'));

                if (bookKeys.length === 0) {
                    lib.innerHTML = '<p style="padding:20px; color:#666;">La tua libreria è vuota. Clicca sul + per aggiungere un libro.</p>';
                    return;
                }

                for (let key of bookKeys) {
                    const book = await localforage.getItem(key);
                    const div = document.createElement('div');
                    div.className = 'book-card';
                    div.onclick = () => openBook(book);
                    div.innerHTML = `
                        <img src="${book.cover || 'https://via.placeholder.com/150'}" onerror="this.src='https://via.placeholder.com/150'">
                        <p>${book.title}</p>
                    `;
                    lib.appendChild(div);
                }
            } catch (err) {
                console.error("Errore nel caricamento libreria:", err);
            }
        }

        // APERTURA LIBRO
        async function openBook(bookData) {
            document.getElementById('player').style.display = 'block';
            document.getElementById('now-playing').innerText = "Caricamento: " + bookData.title;
            
            if (currentBook) {
                currentBook.destroy();
            }

            currentBook = ePub(bookData.content);
            const viewer = document.createElement('div'); // Contenitore temporaneo
            rendition = currentBook.renderTo(viewer, { width: "100%", height: "100%" });
            
            await rendition.display(bookData.cfi || undefined);
            document.getElementById('now-playing').innerText = "Pronto: " + bookData.title;
            window.currentBookId = bookData.id;
        }

        // RIPRODUZIONE AUDIO
        async function togglePlay() {
            if (isReading) {
                speech.pause();
                document.getElementById('playBtn').innerText = "Riprendi";
                isReading = false;
            } else {
                if (speech.paused && speech.speaking) {
                    speech.resume();
                } else {
                    await readChapter();
                }
                document.getElementById('playBtn').innerText = "Pausa";
                isReading = true;
            }
        }

        async function readChapter() {
            speech.cancel();
            
            // Otteniamo il testo del capitolo corrente
            const location = rendition.currentLocation();
            const section = currentBook.spine.get(location.start.cfi);
            const doc = await section.load(currentBook.load.bind(currentBook));
            const text = doc.body.innerText;

            // Pulizia base del testo
            const cleanText = text.replace(/\s+/g, ' ').trim();
            
            utterance = new SpeechSynthesisUtterance(cleanText);
            const selectedVoice = document.getElementById('voiceSelect').value;
            utterance.voice = speech.getVoices().find(v => v.name === selectedVoice);
            utterance.lang = utterance.voice ? utterance.voice.lang : 'it-IT';
            utterance.rate = 1.0;

            speech.speak(utterance);
        }

        function stopReading() {
            speech.cancel();
            isReading = false;
            document.getElementById('playBtn').innerText = "Play";
        }

        async function saveBookmark() {
            if (!window.currentBookId) return;
            const cfi = rendition.currentLocation().start.cfi;
            const bookData = await localforage.getItem(window.currentBookId);
            bookData.cfi = cfi;
            await localforage.setItem(window.currentBookId, bookData);
            alert("Posizione salvata!");
        }

        // Carica la libreria all'avvio
        renderLibrary();
    </script>
 
</body>
</html>
