<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Mio Lettore HTML</title>
    <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
    <style>
        :root { --bg: #ffffff; --text: #1a1a1a; --accent: #4285f4; }
        body { font-family: 'Georgia', serif; margin: 0; background: var(--bg); color: var(--text); line-height: 1.6; }
        #library { padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
        .book-item { border: 1px solid #ddd; padding: 15px; border-radius: 10px; cursor: pointer; text-align: center; background: #f9f9f9; }
        
        #reader-view { display: none; padding: 20px; padding-bottom: 150px; }
        #controls { position: fixed; bottom: 0; width: 100%; background: white; border-top: 1px solid #ddd; padding: 15px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); }
        .btns { display: flex; justify-content: space-around; }
        button { padding: 12px 25px; border-radius: 25px; border: none; background: var(--accent); color: white; font-weight: bold; font-size: 16px; }
        .secondary { background: #5f6368; }
        select { padding: 8px; border-radius: 5px; border: 1px solid #ccc; width: 100%; }
        .back-btn { margin-bottom: 20px; display: block; color: var(--accent); text-decoration: none; font-weight: bold; }
        #content-area { font-size: 1.1em; max-width: 800px; margin: 0 auto; }
        .highlight { background-color: yellow; } /* Evidenzia la frase letta */
    </style>
</head>
<body>

    <div id="library-view">
        <h2 style="padding: 20px;">I miei Libri</h2>
        <div id="library"></div>
        <button style="position:fixed; bottom:20px; right:20px; width:60px; height:60px; border-radius:50%;" onclick="document.getElementById('fileInput').click()">+</button>
        <input type="file" id="fileInput" style="display:none" accept=".html,.txt" onchange="importFile(event)">
    </div>

    <div id="reader-view">
        <a href="#" class="back-btn" onclick="showLibrary()">← Torna alla Libreria</a>
        <div id="content-area"></div>
        
        <div id="controls">
            <div id="reading-status" style="font-size: 0.8em; text-align: center; color: #666;"></div>
            <div class="btns">
                <button class="secondary" onclick="savePosition()">📌 Segna</button>
                <button id="playBtn" onclick="toggleRead()">Riproduci</button>
                <button class="secondary" onclick="stopRead()">Stop</button>
            </div>
            <select id="voiceSelect"></select>
        </div>
    </div>

    <script>
        const synth = window.speechSynthesis;
        let voices = [];
        let currentBookId = null;
        let isPlaying = false;

        // Caricamento Voci
        function loadVoices() {
            voices = synth.getVoices();
            const select = document.getElementById('voiceSelect');
            const filtered = voices.filter(v => v.lang.includes('it') || v.lang.includes('en'));
            select.innerHTML = filtered.map(v => `<option value="${v.name}">${v.name} (${v.lang})</option>`).join('');
        }
        synth.onvoiceschanged = loadVoices;
        loadVoices();

        async function importFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const text = await file.text();
            const id = "book_" + Date.now();
            const book = { id, title: file.name, content: text, lastPos: 0 };
            await localforage.setItem(id, book);
            renderLibrary();
        }

        async function renderLibrary() {
            const lib = document.getElementById('library');
            lib.innerHTML = "";
            const keys = await localforage.keys();
            for (let k of keys) {
                const b = await localforage.getItem(k);
                lib.innerHTML += `<div class="book-item" onclick="openBook('${b.id}')">📖<br>${b.title}</div>`;
            }
        }

        async function openBook(id) {
            const b = await localforage.getItem(id);
            currentBookId = id;
            document.getElementById('library-view').style.display = 'none';
            document.getElementById('reader-view').style.display = 'block';
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = b.content;
            
            // Scorri fino alla posizione salvata
            window.scrollTo(0, b.lastPos || 0);
        }

        function showLibrary() {
            stopRead();
            document.getElementById('library-view').style.display = 'block';
            document.getElementById('reader-view').style.display = 'none';
        }

        function toggleRead() {
            if (isPlaying) {
                synth.pause();
                isPlaying = false;
                document.getElementById('playBtn').innerText = "Riprendi";
            } else {
                if (synth.paused) {
                    synth.resume();
                } else {
                    startReadingFromScroll();
                }
                isPlaying = true;
                document.getElementById('playBtn').innerText = "Pausa";
            }
        }

        function startReadingFromScroll() {
            synth.cancel();
            // Trucco: prendiamo il testo visibile nella parte alta dello schermo
            const text = document.getElementById('content-area').innerText;
            // Calcoliamo approssimativamente dove si trova l'utente basandoci sullo scroll
            const scrollPercent = window.scrollY / document.body.scrollHeight;
            const startChar = Math.floor(text.length * scrollPercent);
            
            const utter = new SpeechSynthesisUtterance(text.substring(startChar));
            const selectedVoice = document.getElementById('voiceSelect').value;
            utter.voice = voices.find(v => v.name === selectedVoice);
            utter.lang = utter.voice.lang;
            utter.rate = 1.0;

            synth.speak(utter);
        }

        function stopRead() {
            synth.cancel();
            isPlaying = false;
            document.getElementById('playBtn').innerText = "Riproduci";
        }

        async function savePosition() {
            const b = await localforage.getItem(currentBookId);
            b.lastPos = window.scrollY;
            await localforage.setItem(currentBookId, b);
            alert("Posizione salvata!");
        }

        renderLibrary();
    </script>
</body>
</html>
