<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lettore HTML Intelligente</title>
    <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
    <style>
        :root { --bg: #fdf6e3; --text: #2c3e50; --accent: #d33682; }
        body { font-family: 'Georgia', serif; margin: 0; background: var(--bg); color: var(--text); }
        
        /* Libreria */
        #library-view { padding: 20px; }
        #library { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .book-item { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; cursor: pointer; }
        
        /* Lettore */
        #reader-view { display: none; padding: 20px; padding-bottom: 180px; }
        #content-area p { cursor: pointer; padding: 5px; border-radius: 5px; transition: 0.3s; margin-bottom: 1em; }
        #content-area p:hover { background: rgba(0,0,0,0.05); }
        #content-area p.reading { background: #fff9c4; border-left: 4px solid var(--accent); }
        
        /* Controlli */
        #controls { position: fixed; bottom: 0; left: 0; right: 0; background: white; padding: 15px; box-shadow: 0 -5px 15px rgba(0,0,0,0.1); z-index: 1000; }
        .btns { display: flex; justify-content: space-around; gap: 10px; margin-bottom: 10px; }
        button { flex: 1; padding: 12px; border-radius: 25px; border: none; background: var(--accent); color: white; font-weight: bold; font-size: 14px; }
        .btn-sec { background: #586e75; }
        select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
        .back-link { display: block; margin-bottom: 20px; color: var(--accent); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div id="library-view">
        <h2>📚 I miei Libri HTML</h2>
        <div id="library"></div>
        <button style="position:fixed; bottom:20px; right:20px; width:60px; height:60px; border-radius:50%; font-size:30px;" onclick="document.getElementById('fileInput').click()">+</button>
        <input type="file" id="fileInput" style="display:none" accept=".html" onchange="importFile(event)">
    </div>

    <div id="reader-view">
        <a href="#" class="back-link" onclick="location.reload()">← Torna alla Libreria</a>
        <div id="content-area"></div>
        
        <div id="controls">
            <div id="status" style="font-size: 0.8em; text-align: center; margin-bottom: 5px; color: #666;">Tocca un paragrafo per leggere</div>
            <div class="btns">
                <button class="btn-sec" onclick="saveBookmark()">📌 Segna</button>
                <button id="pauseBtn" onclick="stopSpeech()">Pausa</button>
            </div>
            <select id="voiceSelect"></select>
        </div>
    </div>

    <script>
        const synth = window.speechSynthesis;
        let currentBookId = null;
        let lastReadPara = null;

        // 1. Caricamento Voci (migliorato)
        function populateVoices() {
            const voices = synth.getVoices();
            const select = document.getElementById('voiceSelect');
            const filtered = voices.filter(v => v.lang.includes('it') || v.lang.includes('en'));
            select.innerHTML = filtered.map(v => `<option value="${v.name}">${v.name} (${v.lang})</option>`).join('');
        }
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = populateVoices;
        }
        populateVoices();

        // 2. Importazione
        async function importFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const text = await file.text();
            const id = "h_" + Date.now();
            await localforage.setItem(id, { id, title: file.name, content: text, savedIndex: 0 });
            renderLibrary();
        }

        async function renderLibrary() {
            const lib = document.getElementById('library');
            lib.innerHTML = "";
            const keys = await localforage.keys();
            for (let k of keys) {
                if (k.startsWith("h_")) {
                    const b = await localforage.getItem(k);
                    const div = document.createElement('div');
                    div.className = 'book-item';
                    div.innerHTML = `📖<br>${b.title}`;
                    div.onclick = () => openBook(b.id);
                    lib.appendChild(div);
                }
            }
        }

        // 3. Apertura Libro con Paragrafizzazione
        async function openBook(id) {
            const b = await localforage.getItem(id);
            currentBookId = id;
            document.getElementById('library-view').style.display = 'none';
            document.getElementById('reader-view').style.display = 'block';
            
            const area = document.getElementById('content-area');
            
            // Pulizia e creazione paragrafi
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = b.content;
            const textContent = tempDiv.innerText.split('\n').filter(p => p.trim().length > 2);
            
            area.innerHTML = textContent.map((p, index) => 
                `<p id="p-${index}" onclick="readParagraph(${index})">${p}</p>`
            ).join('');

            // Vai al segnalibro se esiste
            if (b.savedIndex) {
                const el = document.getElementById(`p-${b.savedIndex}`);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // 4. Lettura del Paragrafo
        function readParagraph(index) {
            stopSpeech();
            
            const el = document.getElementById(`p-${index}`);
            if (!el) return;

            // Evidenziazione
            if (lastReadPara) lastReadPara.classList.remove('reading');
            el.classList.add('reading');
            lastReadPara = el;
            lastReadPara.index = index; // Salviamo l'indice corrente

            const utter = new SpeechSynthesisUtterance(el.innerText);
            const selectedVoiceName = document.getElementById('voiceSelect').value;
            utter.voice = synth.getVoices().find(v => v.name === selectedVoiceName);
            
            // Quando finisce questo paragrafo, passa al prossimo!
            utter.onend = () => {
                readParagraph(index + 1);
            };

            synth.speak(utter);
            document.getElementById('status').innerText = "Lettura in corso...";
        }

        function stopSpeech() {
            synth.cancel();
            document.getElementById('status').innerText = "In pausa";
        }

        async function saveBookmark() {
            if (lastReadPara && currentBookId) {
                const b = await localforage.getItem(currentBookId);
                b.savedIndex = lastReadPara.index;
                await localforage.setItem(currentBookId, b);
                alert("Posizione salvata al paragrafo corrente!");
            } else {
                alert("Tocca un paragrafo prima di segnare la posizione.");
            }
        }

        renderLibrary();
    </script>
</body>
</html>
